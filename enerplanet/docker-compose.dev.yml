# Local development overrides for Enerplanet
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  energy-backend:
    # The production image: the backend serving the built frontend on :8000,
    # plus the migrate and seed binaries `make migrate` and `make seed` run.
    build:
      context: ..
      dockerfile: Dockerfile.ci
    # Host networking runs the container as a host-run backend would: on
    # backend/.env alone, reaching each service on its published localhost
    # port, which is also what the migrations seed as the PyLovo address.
    network_mode: host
    networks: !reset []
    environment: !reset {}
