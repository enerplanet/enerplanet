host: localhost:8000
info:
  contact: {}
  description: |-
    Unified API for the EnerPlanET energy planning platform.
    Includes native backend endpoints and proxied Pylovo (grid/boundary) services.
  title: EnerPlanET API
  version: "1.0"
paths:
  /models:
    get:
      consumes:
      - application/json
      description: |-
        Returns a paginated list of energy planning models the user has access to,
        filtered by workspace and search query. Includes shared and workspace-scoped models.
      parameters:
      - default: 100
        description: Max results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Search models by title (case-insensitive)
        in: query
        name: search
        type: string
      - description: Filter by workspace ID
        in: query
        name: workspace_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.GetModelsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
      security:
      - SessionAuth: []
      summary: List models for the authenticated user
      tags:
      - EnerPlanET
  /v1/city2tabula/enrich:
    post:
      consumes:
      - application/json
      description: |-
        Given a drawn area (country, its PyLovo osm_ids, and the bbox) returns a per-osm_id
        merge map of BuEM envelope data. Returns 200 "completed" when every osm_id is already
        linked, or 202 "running" with a run_id when a bbox-scoped pipeline run was triggered
        (the buildings resolved so far are returned alongside). Poll GET .../enrich/{run_id}.
      parameters:
      - description: Drawn area
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/spatialhub_backend_internal_api_contracts.EnrichRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.EnrichResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.EnrichResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Resolve City2TABULA 3D data for a drawn area
      tags:
      - City2TABULA
  /v1/city2tabula/enrich/{run_id}:
    get:
      description: |-
        Proxies the City2TABULA run status. When the run has completed and country and
        osm_ids are given as query parameters, also returns the merge map for those buildings,
        so the client polls one endpoint and gets data when ready.
      parameters:
      - description: Run id from the 202 enrich response
        in: path
        name: run_id
        required: true
        type: string
      - description: Country, required to receive data on completion
        in: query
        name: country
        type: string
      - description: Comma-separated osm_ids, required to receive data on completion
        in: query
        name: osm_ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.EnrichResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
        "404":
          description: No run with this id (stale or mistyped)
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Poll a City2TABULA enrich run
      tags:
      - City2TABULA
  /v1/heat-demand/resolve:
    post:
      consumes:
      - application/json
      description: |-
        Given a building's usage class, floor area, and (for a residential building)
        its TABULA type / construction year / country, returns its annual space-heating
        demand (kWh/a), the specific demand (kWh/m2.a) and a source flag ("ignis" when a
        TABULA archetype matched, "estimate" otherwise). tabula_variant_code is set only
        for source "ignis". hourly_profile is currently always null (source "buem" is not
        yet wired). A residential building that falls back to the estimate carries a
        warning naming why.
      parameters:
      - description: Building inputs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/spatialhub_backend_internal_api_contracts.HeatDemandResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.HeatDemandResolveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
      security:
      - SessionAuth: []
      summary: Resolve a building's annual space-heating demand
      tags:
      - HeatDemand
  /v2/pylovo/boundary:
    get:
      description: |-
        Returns the administrative boundary polygon (GeoJSON) for a given lat/lon.
        This is a public endpoint — no authentication required.
      parameters:
      - description: Latitude
        example: 48.137
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 11.575
        in: query
        name: lon
        required: true
        type: number
      - default: 4
        description: OSM admin level (default 4)
        in: query
        name: admin_level
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.GetBoundaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/spatialhub_backend_internal_api_contracts.ErrorResponse'
      summary: Get administrative boundary by coordinates
      tags:
      - EnerPlanET
schemes:
- http
securityDefinitions:
  APITokenAuth:
    description: 'API token obtained via POST /api/users/{userId}/tokens. Format:
      Bearer whf_xxx'
    in: header
    name: Authorization
    type: apiKey
  SessionAuth:
    description: Session cookie obtained via POST /api/login
    in: cookie
    name: session_id
    type: apiKey
swagger: "2.0"
