name: Publish Docker image

# Builds the EnerPlanET runtime image (backend + embedded frontend, the
# Dockerfile.ci shape) and publishes it to GHCR on a release tag, so
# deployments pull a pinned image instead of building on the server. Mirrors
# the enerplanet/ignis docker-publish pattern: semver-tagged, version-stamped.
#
# The image is environment-agnostic: the frontend reads its settings from
# /config.js at runtime, served by the backend from FRONTEND_* env vars, so no
# build args are baked. One image runs beta and production; the deployer
# supplies the environment as container env vars.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push enerplanet image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dockerfile.ci builds from the repo root and needs the submodules
          # (platform-core, libs, infrastructure) and submodules/Coati in
          # context; images are tracked in Git LFS.
          submodules: recursive
          lfs: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Materialise Git LFS assets
        run: |
          set -e
          # checkout fetches LFS objects, but the filter needs git config to
          # turn pointers into files (mirrors build-app in the deploy pipeline).
          git lfs install --local
          git lfs pull
          LOGO=enerplanet/frontend/public/images/logo/enerplanet-logo.png
          if head -c 40 "$LOGO" | grep -q 'git-lfs'; then
            echo "ERROR: $LOGO is still a Git LFS pointer - refusing to build a broken image"
            exit 1
          fi
          echo "LFS assets OK ($(stat -c%s "$LOGO") bytes)"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enerplanet/enerplanet
          tags: |
            # v1.2.3 tag -> 1.2.3 image (no v), matching the *_IMAGE_TAG pins
            # in repos.conf and the enerploy component registry convention.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          # The image is environment-agnostic: the frontend reads its config
          # from /config.js at runtime (backend serves it from FRONTEND_* env
          # vars), so no build args are baked here. Deployers supply the
          # environment as container env vars — the same image runs beta and
          # production.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=enerplanet
          cache-to: type=gha,mode=max,scope=enerplanet
