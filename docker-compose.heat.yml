# The heat services: City2TABULA, ignis and BuEM, from published images only.
# A target machine needs this file, docker-compose.shared.yml, heat.env,
# shared.env and a TentaCron config; no source checkout of any repository.
#
# ---
# Usage:  docker compose --env-file heat.env --env-file shared.env \
#           -f docker-compose.heat.yml -f docker-compose.shared.yml pull
#         docker compose --env-file heat.env --env-file shared.env \
#           -f docker-compose.heat.yml -f docker-compose.shared.yml up -d
# ---
#
# This file holds the services that model heat demand. The services that serve
# every simulation domain, not heat alone, are in docker-compose.shared.yml:
# weather-serve, which answers reanalysis point queries for any model, and
# TentaCron, which brokers heat, grid and simulation targets alike. The two
# files are always deployed together as one project, so service-name
# resolution and depends_on work across them.
#
# Why one file per layer rather than each repository's own compose. ignis
# publishes a deployment-ready compose; the others do not yet. buem-gateway's
# carries no shared-network block and city2tabula's still builds an
# interactive shell from source, so neither runs unattended on a server.
# Assembling the stack here needs no change in those repositories and no
# source on the target.
#
# Service names are the contract. TentaCron addresses ignis-http,
# city2tabula-server and buem-gateway by name, so these names match its
# configuration exactly.
#
# Nothing publishes a host port. The only way in is the EnerPlanET backend,
# which reaches TentaCron over spatialhub-net; every other service is
# reachable only from inside this project. Nothing in the stack authenticates
# a caller, so that containment is the trust boundary, not a convenience.
#
# Pin every tag in heat.env. `latest` on buem-model moves on every push to its
# release branch, so following it would change production without a deploy.
#
# The project name stays `heat` because the named volumes below are prefixed
# with it. Renaming the project would orphan the databases on every machine
# already running this stack.
name: heat

services:
  # --- City2TABULA: 3D envelopes -------------------------------------------
  city2tabula-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${C2T_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${C2T_DB_PASSWORD:?set C2T_DB_PASSWORD in heat.env}
      POSTGRES_DB: ${C2T_DB_NAME:-city2tabula}
    volumes:
      - city2tabula-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  city2tabula-server:
    image: ghcr.io/thd-spatial-ai/city2tabula-server:${C2T_IMAGE_TAG:?pin C2T_IMAGE_TAG in heat.env}
    environment:
      # The server derives a per-country database as <DB_NAME>_<country>, which
      # is what the fixtures restore into (city2tabula_nl, city2tabula_de).
      DB_HOST: city2tabula-db
      DB_PORT: 5432
      DB_USER: ${C2T_DB_USER:-postgres}
      DB_PASSWORD: ${C2T_DB_PASSWORD:?set C2T_DB_PASSWORD in heat.env}
      DB_NAME: ${C2T_DB_NAME:-city2tabula}
      DB_SSL_MODE: disable
      SERVER_PORT: 5000
    depends_on:
      city2tabula-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- ignis: TABULA annual demand -----------------------------------------
  ignis-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${IGNIS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${IGNIS_DB_PASSWORD:?set IGNIS_DB_PASSWORD in heat.env}
      POSTGRES_DB: ${IGNIS_DB_NAME:-ignis}
    volumes:
      - ignis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ignis-http:
    image: ghcr.io/thd-spatial-ai/ignis:${IGNIS_IMAGE_TAG:?pin IGNIS_IMAGE_TAG in heat.env}
    environment:
      APP_PORT: 8080
      DB_HOST: ignis-db
      DB_PORT: 5432
      DB_USER: ${IGNIS_DB_USER:-postgres}
      DB_PASSWORD: ${IGNIS_DB_PASSWORD:?set IGNIS_DB_PASSWORD in heat.env}
      DB_NAME: ${IGNIS_DB_NAME:-ignis}
      DB_SSL_MODE: disable
      # Browser callers only. TentaCron and the backend send no Origin header.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      ignis-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ignis/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-off, destructive: DROPs and recreates every country table from the
  # TABULA workbook baked into the image. Gated so it never runs on `up`.
  #   docker compose ... --profile seed run --rm ignis-build-db
  ignis-build-db:
    image: ghcr.io/thd-spatial-ai/ignis-build-db:${IGNIS_IMAGE_TAG:?pin IGNIS_IMAGE_TAG in heat.env}
    profiles: [seed]
    environment:
      DB_HOST: ignis-db
      DB_PORT: 5432
      DB_USER: ${IGNIS_DB_USER:-postgres}
      DB_PASSWORD: ${IGNIS_DB_PASSWORD:?set IGNIS_DB_PASSWORD in heat.env}
      DB_NAME: ${IGNIS_DB_NAME:-ignis}
      DB_SSL_MODE: disable
    depends_on:
      ignis-db:
        condition: service_healthy

  # --- BuEM: hourly thermal model ------------------------------------------
  buem-model:
    image: ghcr.io/enerplanet/buem-model:${BUEM_MODEL_IMAGE_TAG:?pin BUEM_MODEL_IMAGE_TAG in heat.env}
    environment:
      BUEM_CBC_EXE: /opt/conda/envs/buem_env/bin/cbc
      # Every request carries its own weather, so the container needs no
      # archive of its own.
      BUEM_WEATHER_FALLBACK: "false"
      BUEM_RESULTS_DIR: /app/results
    volumes:
      - buem-results-data:/app/results
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  buem-gateway:
    image: ghcr.io/enerplanet/buem-gateway:${BUEM_GATEWAY_IMAGE_TAG:?pin BUEM_GATEWAY_IMAGE_TAG in heat.env}
    environment:
      APP_PORT: 8080
      BUEM_SERVICE_HOST: buem-model
      BUEM_SERVICE_PORT: 5000
      BUEM_DATA_DIR: /app/data
      # Must match buem-model's: the model writes results here and the gateway
      # reads and deletes them.
      BUEM_RESULTS_DIR: /app/results
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - buem-csv-data:/app/data
      - buem-results-data:/app/results
    depends_on:
      buem-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/buem/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  city2tabula-db-data:
  ignis-db-data:
  buem-csv-data:
  # buem-model writes results here and buem-gateway reads and deletes them, so
  # both mount the same volume.
  buem-results-data:
