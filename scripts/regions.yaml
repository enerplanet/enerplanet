# Weather archives, queried at the centre of every PyLovo state above.
# Each entry is the query weather-serve's /v1/weather/point takes: provider
# plus year or scenario.
weather:
  - {provider: merra-2, scenario: p50}
  - {provider: cosmo-rea6, year: 2018}
