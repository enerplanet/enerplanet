# Data the production heat stack must hold. Models are built on these regions,
# so a redeploy or a regeneration that drops one breaks them.
# scripts/check-regions.py checks a running stack against this file; see
# scripts/deploy-heat-stack.md#check.

# PyLovo regions: postcode -> grid count of the package that was loaded.
# A deploy fails when a postcode is missing or its state holds fewer grids
