# Repository configuration for EnerPlanET platform services. Each repository has:
# _REPO: its URL
# _DIR: its folder under dependencies/
# _BRANCH: the branch to use
# _IMAGE_TAG: the Docker image tag (if applicable)
# _PORT: the host port for the service (if applicable)
# _COMPOSE: the compose file that builds it, relative to its checkout
# _ENV_FILE: the env file passed to compose, relative to its checkout (if any)
# _SERVICES: the compose service to start, when not all of them (if any)

# SIMENGINE_REPO=https://github.com/enerplanet/simulation-engine.git
